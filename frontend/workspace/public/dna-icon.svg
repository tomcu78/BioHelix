<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220" width="140" height="220" role="img" aria-label="BioHelix DNA Icon">
  <defs>
    <linearGradient id="iconDnaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="iconDnaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <style>
    .strand1 { stroke: url(#iconDnaGrad1); stroke-width: 4; fill: none; stroke-linecap: round; }
    .strand2 { stroke: url(#iconDnaGrad2); stroke-width: 4; fill: none; stroke-linecap: round; }
    .rung { stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 3, 3; opacity: 0.85; }
    .node1 { fill: #38bdf8; filter: drop-shadow(0 0 5px #0ea5e9); }
    .node2 { fill: #a855f7; filter: drop-shadow(0 0 5px #8b5cf6); }
  </style>

  <!-- Base pair rungs -->
  <line x1="50" y1="30" x2="90" y2="45" class="rung" />
  <line x1="35" y1="65" x2="105" y2="65" class="rung" />
  <line x1="50" y1="100" x2="90" y2="85" class="rung" />
  <line x1="90" y1="130" x2="50" y2="145" class="rung" />
  <line x1="105" y1="165" x2="35" y2="165" class="rung" />
  <line x1="90" y1="200" x2="50" y2="185" class="rung" />

  <!-- Strands -->
  <path d="M 70,15 Q 20,65 70,115 T 70,215" class="strand1" />
  <path d="M 70,15 Q 120,65 70,115 T 70,215" class="strand2" />

  <!-- Nodes Strand 1 -->
  <circle cx="70" cy="15" r="5.5" class="node1" />
  <circle cx="50" cy="30" r="5" class="node1" />
  <circle cx="35" cy="65" r="6" class="node1" />
  <circle cx="50" cy="100" r="5" class="node1" />
  <circle cx="70" cy="115" r="5.5" class="node1" />
  <circle cx="90" cy="130" r="5" class="node1" />
  <circle cx="105" cy="165" r="6" class="node1" />
  <circle cx="90" cy="200" r="5" class="node1" />
  <circle cx="70" cy="215" r="5.5" class="node1" />

  <!-- Nodes Strand 2 -->
  <circle cx="70" cy="15" r="5.5" class="node2" />
  <circle cx="90" cy="45" r="5" class="node2" />
  <circle cx="105" cy="65" r="6" class="node2" />
  <circle cx="90" cy="85" r="5" class="node2" />
  <circle cx="70" cy="115" r="5.5" class="node2" />
  <circle cx="50" cy="145" r="5" class="node2" />
  <circle cx="35" cy="165" r="6" class="node2" />
  <circle cx="50" cy="185" r="5" class="node2" />
  <circle cx="70" cy="215" r="5.5" class="node2" />
</svg>
