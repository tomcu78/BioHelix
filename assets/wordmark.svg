<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="BioHelix">
  <defs>
    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .strand1 { stroke: url(#dnaGrad1); stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .strand2 { stroke: url(#dnaGrad2); stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .rung { stroke: #64748b; stroke-width: 2; stroke-dasharray: 2, 2; opacity: 0.8; }
    .node1 { fill: #38bdf8; filter: drop-shadow(0 0 4px #0ea5e9); }
    .node2 { fill: #a855f7; filter: drop-shadow(0 0 4px #8b5cf6); }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 42px; font-weight: 800; letter-spacing: 4px; fill: url(#textGrad); }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 2px; fill: #94a3b8; }
    .author { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; font-weight: 600; fill: #10b981; }
  </style>

  <!-- Left: DNA Double Helix Icon -->
  <g transform="translate(40, 20)">
    <!-- Base pair rungs connecting strands -->
    <line x1="45" y1="25" x2="85" y2="40" class="rung" />
    <line x1="30" y1="60" x2="100" y2="60" class="rung" />
    <line x1="45" y1="95" x2="85" y2="80" class="rung" />
    <line x1="65" y1="110" x2="65" y2="110" class="rung" />
    <line x1="85" y1="125" x2="45" y2="140" class="rung" />
    <line x1="100" y1="160" x2="30" y2="160" class="rung" />
    <line x1="85" y1="195" x2="45" y2="180" class="rung" />

    <!-- DNA Strand 1 (Sine wave) -->
    <path d="M 65,10 Q 15,60 65,110 T 65,210" class="strand1" />
    
    <!-- DNA Strand 2 (Opposite Sine wave) -->
    <path d="M 65,10 Q 115,60 65,110 T 65,210" class="strand2" />

    <!-- Base nodes Strand 1 -->
    <circle cx="65" cy="10" r="5" class="node1" />
    <circle cx="45" cy="25" r="4.5" class="node1" />
    <circle cx="30" cy="60" r="5.5" class="node1" />
    <circle cx="45" cy="95" r="4.5" class="node1" />
    <circle cx="65" cy="110" r="5" class="node1" />
    <circle cx="85" cy="125" r="4.5" class="node1" />
    <circle cx="100" cy="160" r="5.5" class="node1" />
    <circle cx="85" cy="195" r="4.5" class="node1" />
    <circle cx="65" cy="210" r="5" class="node1" />

    <!-- Base nodes Strand 2 -->
    <circle cx="65" cy="10" r="5" class="node2" />
    <circle cx="85" cy="40" r="4.5" class="node2" />
    <circle cx="100" cy="60" r="5.5" class="node2" />
    <circle cx="85" cy="80" r="4.5" class="node2" />
    <circle cx="65" cy="110" r="5" class="node2" />
    <circle cx="45" cy="140" r="4.5" class="node2" />
    <circle cx="30" cy="160" r="5.5" class="node2" />
    <circle cx="45" cy="180" r="4.5" class="node2" />
    <circle cx="65" cy="210" r="5" class="node2" />
  </g>

  <!-- Right: Typography & Branding -->
  <g transform="translate(200, 75)">
    <text x="0" y="40" class="title">BIOHELIX</text>
    <text x="0" y="70" class="tagline">SCIENTIFIC INTELLIGENCE WORKBENCH</text>
    <g transform="translate(0, 95)">
      <rect x="0" y="-14" width="95" height="22" rx="6" fill="#064e3b" opacity="0.6" />
      <text x="10" y="2" class="author">BY TOMCU</text>
    </g>
  </g>
</svg>
